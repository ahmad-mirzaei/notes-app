<h1>یادداشت های من</h1>

<a href="{% url 'note-create' %}">
    یادداشت جدید بنویس
</a>

<ul>
    {% for note in notes %}
        <li>
            {{ note.title }} <br>
            <a href="{% url 'note-detail' note.pk %}">ویرایش </a>
            &nbsp;|&nbsp;
            <a href="{% url 'note-delete' note.pk %}">حذف</a>
        </li>
        <br>
        {% empty %}
        <li> No Notes Yet </li>
    {% endfor %}
</ul>
