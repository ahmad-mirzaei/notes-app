<form method="GET">
    <input
        type="text"
        name="q"
        placeholder="جستجوی یادداشت..."
        value="{{ request.GET.q }}"
    >

    <button type="submit"> جستجو </button>

    <br>
    {% if request.GET.q %} 
        <p> نتایج جستجو برای: <strong>{{ request.GET.q }}</strong> </p> 
    {% endif %}

    <a href="{% url 'note-list' %}"> پاک کردن جستجو</a>
</form>

<hr>

<h1>یادداشت های من</h1>

<a href="{% url 'note-create' %}">
    یادداشت جدید بنویس
</a>

<ul>
    {% for note in notes %}
        <li>
            <h4><a href="{% url 'note-detail' note.pk %}">{{ note.title }}</a></h4>
            
            <a href="{% url 'note-update' note.pk %}">ویرایش </a>
            &nbsp;|&nbsp;
            <a href="{% url 'note-delete' note.pk %}">حذف</a><hr>
        </li>
        {% empty %}
        <li>هیچ یادداشتی وجود ندارد؛ لطفاً یک یادداشت جدید ایجاد کنید</li>
    {% endfor %}
 
</ul>
